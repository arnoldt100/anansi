; The below environmental variables are mandatory, and if they are not defined
; then the build of Anansi will abort. Each section defines a key-value pair
; where the value is the environmental variable that must be defined. The key name
; is irrelevant. 
[Anansi_Architecture_Target]
    Target=ANANSI_TARGET_ARCHITECTURE

[Anansi_Package_Path]
    TOP_LEVEL=ANANSI_TOP_LEVEL
    BIN=ANANSI_BIN_DIRECTORY
    Anansi CMAKE module path = ANANSI_CMAKE_MODULE_PATH

[Anansi_Installation_Prefix]
    PREFIX=ANANSI_INSTALL_PREFIX
    Anansi Headers Install Directory = ANANSI_INSTALL_INCLUDE_DIRECTORY
    Anansi Headers Library Directory = ANANSI_INSTALL_LIB_DIRECTORY

[Anansi_Compilers]
    C++ compiler=ANANSI_CMAKE_CXX_COMPILER
    C compiler=ANANSI_CMAKE_C_COMPILER

[Anansi_Boost]
    BOOST TOP LEVEL=ANANSI_BOOST_TOP_LEVEL

[Anansi_CMake]
    Minimum CMake version=ANANSI_MINIMUM_CMAKE_VERSION
    CMake Build Type=ANANSI_BUILD_TYPE
    Anansi debug build = ANANSI_BUILD_DEBUG
    Anansi release build = ANANSI_BUILD_RELAESE
    Anansi relase with debug info build = ANANSI_BUILD_RELAESE_WITH_DEBUG_INFO
    Anansi minimum size build =  ANANSI_BUILD_RELAESE_WITH_MIN_SIZE

[MPI]
    MPI installation directory=ANANSI_MPICH_DIRECTORY
    MPI run command=ANANSI_MPI_RUN_COMMAND

[Anansi_Core_Variables]
    Anansi off = ANANSI_OFF
    Anansi on = ANANSI_ON

    Mouseion off = MOUSEION_OFF
    Mouseion on = MOUSEION_ON

    Enable cpu data storage = ANANSI_DATA_STORAGE_CPU
    Enable gpu data storage = ANANSI_DATA_STORAGE_GPU

    Enbale low compute precision = ANANSI_LOW_COMPUTE_PRECISION
    Enbale medium compute precision = ANANSI_MEDIUM_COMPUTE_PRECISION
    Enable high compute precision = ANANSI_HIGH_COMPUTE_PRECISION



